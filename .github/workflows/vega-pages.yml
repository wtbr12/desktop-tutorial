name: VEGA news → GitHub Pages

on:
  push:
    paths:
      - 'vega-hud/**'
      - '.github/workflows/vega-pages.yml'
  schedule:
    - cron: '17 * * * *'   # 毎時17分 (UTC) にニュースを再取得
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vega-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch feeds and write static JSON
        working-directory: vega-hud
        run: node build.js
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: vega-hud/public

  deploy:
    # main 以外のブランチではビルド（フィード疎通確認）だけ行う
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
